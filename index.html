<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Фокус</title>
<link rel="stylesheet" href="style.css?v=1">
</head><body>

<div id="top">
<button class="ib g" onclick="drw(1)"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
<div class="ib g" style="opacity:.5">i</div>
</div>

<div id="home" class="scr on">
<div class="srch"><input id="q" class="g" placeholder="Поиск задач" enterkeyhint="search" autocomplete="off"><button id="x" class="g" aria-label="Стереть"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
<div id="list"></div></div>
<div id="empty"><button class="g big" onclick="openAdd()"><svg width="80" height="80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M40 12v56M12 40h56"/></svg></button></div>

<div id="archive" class="scr"><h2>Архив</h2>
<div id="af" class="row" style="gap:8px"></div><div id="al"></div></div>

<div id="settings" class="scr"><h2>Настройки</h2>
<div class="g card" style="margin-top:0">
<div class="st"><span>Язык</span><span style="opacity:.7">Русский</span></div>
<div class="st"><span>Конфетти</span><div class="tgl" id="tc" onclick="tglS('c')"><i></i></div></div>
<div class="st"><span>Вибрация</span><div class="tgl" id="tv" onclick="tglS('v')"><i></i></div></div>
<div class="st"><span>Подсветка</span><div class="tgl" id="tl" onclick="tglS('g')"><i></i></div></div>
<div class="st" onclick="syncInfo()"><span>Облако</span><span id="sync" style="opacity:.7">Подключение…</span></div>
<div class="st" onclick="privacy()"><span>Политика конфиденциальности</span><span style="opacity:.7">›</span></div>
</div>
<button class="pill red" style="margin-top:20px" onclick="ask('Вы действительно хотите сбросить все данные?','Сбросить',()=>{S.tasks=[];save()})">Сбросить данные</button></div>

<div id="profile" class="scr"><h2>Профиль</h2>
<div class="g card" style="margin-top:0"><div class="row" style="gap:14px"><div id="pav" class="av"></div><div><div id="pname" style="font-size:22px"></div><div id="pdate" style="font-size:14px;opacity:.7;margin-top:2px"></div></div></div></div>
<div class="g card"><div style="margin-bottom:8px">Ник в приложении</div><input id="nk" maxlength="24"><button class="pill" onclick="saveNick()">Сохранить</button></div>
<div class="g card"><div style="margin-bottom:12px">Статистика</div>
<div class="row" style="justify-content:space-around;text-align:center"><div><div id="sa" style="font-size:30px"></div><div style="font-size:14px;opacity:.7">В процессе</div></div><div><div id="sf" style="font-size:30px"></div><div style="font-size:14px;opacity:.7">Завершено</div></div></div>
<div style="font-size:14px;opacity:.7;margin:16px 0 8px">Завершено за 7 дней</div>
<div id="ch" style="display:flex;gap:6px;height:110px;align-items:flex-end"></div></div>
<button class="pill red" style="margin-top:20px" onclick="ask('Удалить аккаунт?','Удалить',delAcc)">Удалить аккаунт</button></div>

<div id="ov" onclick="drw(0)"></div>
<div id="dr" class="g"><div onclick="drw(0);go(0)">Главная</div><div style="opacity:.55">Уведомления</div><div onclick="drw(0);openArch()">Архив</div><div style="opacity:.55">Оставить отзыв</div></div>
<div id="md"><div id="mb" class="g"></div></div>
<div id="beta" class="g">Бета</div>

<nav id="nav" class="g">
<div id="bub"></div>
<div class="sl"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg></div>
<div class="sl"><svg viewBox="0 0 1080 1280"><g fill="currentColor" stroke="currentColor"><rect x="258" y="427" width="564" height="563"/><rect x="322" y="130" width="61" height="300"/><rect x="707" y="130" width="61" height="300"/><line x1="335" y1="150" x2="228" y2="312" stroke-width="58"/><line x1="740" y1="150" x2="875" y2="305" stroke-width="58"/><line x1="258" y1="860" x2="102" y2="982" stroke-width="56"/><line x1="822" y1="780" x2="955" y2="605" stroke-width="56"/><rect x="258" y="990" width="52" height="262"/><rect x="358" y="990" width="52" height="217"/><rect x="448" y="990" width="48" height="123"/><rect x="580" y="990" width="47" height="123"/><rect x="668" y="990" width="50" height="217"/><rect x="770" y="990" width="52" height="252"/></g><rect x="321" y="545" width="132" height="130"/><rect x="637" y="545" width="132" height="130"/><rect x="383" y="571" width="60" height="38" fill="#fff"/><rect x="646" y="571" width="60" height="38" fill="#fff"/><rect x="476" y="802" width="128" height="74"/><rect x="510" y="802" width="60" height="38" fill="#6f918a"/></svg></div>
<div class="sl"><div class="pl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></div></div>
<div class="sl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5.5" stroke-width="3"/><circle cx="12" cy="12" r="8.6" stroke-width="3" stroke-dasharray="3 3.4"/></svg></div>
<div class="sl"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7z"/></svg></div>
</nav>

<script src="app.js?v=1"></script>
</body></html>
